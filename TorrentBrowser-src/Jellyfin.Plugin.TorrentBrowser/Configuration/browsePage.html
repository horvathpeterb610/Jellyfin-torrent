<!DOCTYPE html>
<html lang="en">
<head>
    <title>Browse tracker</title>
</head>
<body>
<div id="TorrentBrowserBrowsePage"
     data-role="page"
     class="page type-interior pluginConfigurationPage"
     data-require="emby-input,emby-button,emby-select">
    <div data-role="content">
        <div class="content-primary">

            <style>
                /* Scoped to this page, and deliberately theme-agnostic: every
                   colour is either currentColor, a neutral rgba that reads on
                   both the dark and light themes, or one accent. Jellyfin's own
                   custom properties differ between versions and skins. */
                #TorrentBrowserBrowsePage {
                    --tb-line: rgba(127, 127, 127, .28);
                    --tb-panel: rgba(127, 127, 127, .10);
                    --tb-panel-hi: rgba(127, 127, 127, .20);
                    --tb-accent: #00a4dc;
                    --tb-good: #43a047;
                    --tb-warn: #e0a030;
                    --tb-bad: #e5533d;
                }

                #TorrentBrowserBrowsePage .tbBar {
                    display: flex;
                    flex-wrap: wrap;
                    gap: .75em;
                    align-items: flex-end;
                    padding: 1em;
                    margin-bottom: 1em;
                    border: 1px solid var(--tb-line);
                    border-radius: 10px;
                    background: var(--tb-panel);
                }

                #TorrentBrowserBrowsePage .tbField {
                    display: flex;
                    flex-direction: column;
                    gap: .35em;
                    min-width: 0;
                }

                #TorrentBrowserBrowsePage .tbField > label {
                    font-size: .78em;
                    letter-spacing: .04em;
                    text-transform: uppercase;
                    opacity: .65;
                }

                #TorrentBrowserBrowsePage .tbGrow { flex: 1 1 18em; }

                #TorrentBrowserBrowsePage .tbInput,
                #TorrentBrowserBrowsePage .tbSelect {
                    width: 100%;
                    box-sizing: border-box;
                    padding: .6em .7em;
                    font-size: 1em;
                    font-family: inherit;
                    color: inherit;
                    background: var(--tb-panel-hi);
                    border: 1px solid var(--tb-line);
                    border-radius: 6px;
                }

                #TorrentBrowserBrowsePage .tbInput:focus,
                #TorrentBrowserBrowsePage .tbSelect:focus {
                    outline: none;
                    border-color: var(--tb-accent);
                }

                /* The native dropdown list paints with the OS palette, so force
                   a readable pair rather than inheriting a transparent one. */
                #TorrentBrowserBrowsePage .tbSelect option {
                    color: #111;
                    background: #fff;
                }

                #TorrentBrowserBrowsePage .tbGo {
                    padding: .62em 1.4em;
                    font-size: 1em;
                    font-family: inherit;
                    font-weight: 600;
                    color: #fff;
                    background: var(--tb-accent);
                    border: 0;
                    border-radius: 6px;
                    cursor: pointer;
                }

                #TorrentBrowserBrowsePage .tbGo:hover { filter: brightness(1.1); }
                #TorrentBrowserBrowsePage .tbGo:disabled { opacity: .5; cursor: default; }

                #TorrentBrowserBrowsePage .tbGhost {
                    padding: .62em 1em;
                    font-size: 1em;
                    font-family: inherit;
                    color: inherit;
                    background: var(--tb-panel-hi);
                    border: 1px solid var(--tb-line);
                    border-radius: 6px;
                    cursor: pointer;
                }

                #TorrentBrowserBrowsePage .tbGhost[aria-pressed="true"] {
                    color: #fff;
                    background: var(--tb-accent);
                    border-color: var(--tb-accent);
                }

                /* A remote moves focus, it does not hover. Every focusable
                   thing has to say loudly where it is from three metres away. */
                #TorrentBrowserBrowsePage :focus-visible {
                    outline: 3px solid var(--tb-accent);
                    outline-offset: 2px;
                }

                #TorrentBrowserBrowsePage .tbCard:focus-within {
                    border-color: var(--tb-accent);
                    box-shadow: 0 0 0 3px rgba(0, 164, 220, .5);
                    transform: translateY(-2px);
                }

                #TorrentBrowserBrowsePage .tbCard:focus-within .tbSend {
                    color: #fff;
                    background: var(--tb-accent);
                    border-color: var(--tb-accent);
                }

                /* TV mode. Everything is sized in em, so one font-size on the
                   page scales the whole layout for a ten-foot viewing distance. */
                #TorrentBrowserBrowsePage.tbTv { font-size: 1.35em; }
                #TorrentBrowserBrowsePage.tbTv .tbGrid { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
                #TorrentBrowserBrowsePage.tbTv .tbRelease { display: none; }
                #TorrentBrowserBrowsePage.tbTv .tbCard:focus-within { box-shadow: 0 0 0 5px rgba(0, 164, 220, .6); }

                #TorrentBrowserBrowsePage .tbStatus {
                    display: flex;
                    flex-wrap: wrap;
                    gap: .5em 1.25em;
                    align-items: center;
                    min-height: 1.6em;
                    margin: 0 0 1em;
                    font-size: .9em;
                    opacity: .8;
                }

                #TorrentBrowserBrowsePage .tbStatus.tbError {
                    color: var(--tb-bad);
                    opacity: 1;
                }

                #TorrentBrowserBrowsePage .tbGrid {
                    display: grid;
                    grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
                    gap: 1.1em;
                }

                #TorrentBrowserBrowsePage .tbCard {
                    display: flex;
                    flex-direction: column;
                    overflow: hidden;
                    border: 1px solid var(--tb-line);
                    border-radius: 10px;
                    background: var(--tb-panel);
                    transition: transform .15s ease, border-color .15s ease;
                }

                #TorrentBrowserBrowsePage .tbCard:hover {
                    transform: translateY(-2px);
                    border-color: var(--tb-accent);
                }

                #TorrentBrowserBrowsePage .tbPoster {
                    position: relative;
                    display: block;
                    aspect-ratio: 2 / 3;
                    background: var(--tb-panel-hi);
                    color: inherit;
                    text-decoration: none;
                }

                /* Old browsers without aspect-ratio still need a box. */
                @supports not (aspect-ratio: 2 / 3) {
                    #TorrentBrowserBrowsePage .tbPoster { height: 270px; }
                }

                #TorrentBrowserBrowsePage .tbPoster img {
                    width: 100%;
                    height: 100%;
                    object-fit: cover;
                    display: block;
                    opacity: 0;
                    transition: opacity .25s ease;
                }

                #TorrentBrowserBrowsePage .tbPoster img.tbLoaded { opacity: 1; }

                #TorrentBrowserBrowsePage .tbNoArt {
                    position: absolute;
                    inset: 0;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-size: 2.6em;
                    opacity: .25;
                }

                #TorrentBrowserBrowsePage .tbChip {
                    position: absolute;
                    top: .5em;
                    padding: .2em .5em;
                    font-size: .72em;
                    font-weight: 600;
                    line-height: 1.4;
                    color: #fff;
                    background: rgba(0, 0, 0, .72);
                    border-radius: 4px;
                    backdrop-filter: blur(2px);
                }

                #TorrentBrowserBrowsePage .tbQuality { left: .5em; }
                #TorrentBrowserBrowsePage .tbPeers { right: .5em; }
                #TorrentBrowserBrowsePage .tbPeers.tbHealthy { color: #8bdc9a; }
                #TorrentBrowserBrowsePage .tbPeers.tbDead { color: #ff9c8c; }

                #TorrentBrowserBrowsePage .tbBody {
                    display: flex;
                    flex: 1;
                    flex-direction: column;
                    gap: .5em;
                    padding: .7em;
                }

                #TorrentBrowserBrowsePage .tbTitle {
                    display: -webkit-box;
                    -webkit-line-clamp: 2;
                    -webkit-box-orient: vertical;
                    overflow: hidden;
                    margin: 0;
                    font-size: .95em;
                    font-weight: 600;
                    line-height: 1.35;
                    word-break: break-word;
                }

                #TorrentBrowserBrowsePage .tbYear {
                    font-weight: 400;
                    opacity: .6;
                }

                /* The raw release name stays available but stops shouting: the
                   readable title is what you scan, this is what you verify. */
                #TorrentBrowserBrowsePage .tbRelease {
                    overflow: hidden;
                    margin: -.25em 0 0;
                    font-size: .72em;
                    line-height: 1.4;
                    white-space: nowrap;
                    text-overflow: ellipsis;
                    opacity: .55;
                }

                #TorrentBrowserBrowsePage .tbMeta {
                    display: flex;
                    flex-wrap: wrap;
                    gap: .35em .8em;
                    margin-top: auto;
                    font-size: .8em;
                    opacity: .7;
                }

                #TorrentBrowserBrowsePage .tbTags {
                    display: flex;
                    flex-wrap: wrap;
                    gap: .3em;
                }

                #TorrentBrowserBrowsePage .tbLang {
                    display: inline-flex;
                    gap: .35em;
                    align-items: center;
                    padding: .15em .45em .15em .3em;
                    font-size: .72em;
                    font-weight: 600;
                    letter-spacing: .03em;
                    border: 1px solid var(--tb-line);
                    border-radius: 4px;
                }

                /* Flags are drawn in CSS on purpose. Emoji flags do not render
                   on Windows — the regional indicator pair falls back to the
                   bare letters — and image files would need hosting. */
                #TorrentBrowserBrowsePage .tbSwatch {
                    width: 1.15em;
                    height: .8em;
                    border: 1px solid rgba(0, 0, 0, .35);
                    border-radius: 2px;
                    background: var(--tb-flag, linear-gradient(180deg, #888, #555));
                }

                #TorrentBrowserBrowsePage .tbLang[data-lang="hu"] { --tb-flag: linear-gradient(180deg, #cd2a3e 33.3%, #fff 33.3% 66.6%, #436f4d 66.6%); }
                #TorrentBrowserBrowsePage .tbLang[data-lang="en"] { --tb-flag: linear-gradient(180deg, #00247d 40%, #fff 40% 60%, #cf142b 60%); }
                #TorrentBrowserBrowsePage .tbLang[data-lang="de"] { --tb-flag: linear-gradient(180deg, #000 33.3%, #dd0000 33.3% 66.6%, #ffce00 66.6%); }
                #TorrentBrowserBrowsePage .tbLang[data-lang="fr"] { --tb-flag: linear-gradient(90deg, #002395 33.3%, #fff 33.3% 66.6%, #ed2939 66.6%); }
                #TorrentBrowserBrowsePage .tbLang[data-lang="it"] { --tb-flag: linear-gradient(90deg, #008c45 33.3%, #fff 33.3% 66.6%, #cd212a 66.6%); }
                #TorrentBrowserBrowsePage .tbLang[data-lang="es"] { --tb-flag: linear-gradient(180deg, #aa151b 25%, #f1bf00 25% 75%, #aa151b 75%); }
                #TorrentBrowserBrowsePage .tbLang[data-lang="ru"] { --tb-flag: linear-gradient(180deg, #fff 33.3%, #0039a6 33.3% 66.6%, #d52b1e 66.6%); }
                #TorrentBrowserBrowsePage .tbLang[data-lang="pl"] { --tb-flag: linear-gradient(180deg, #fff 50%, #dc143c 50%); }
                #TorrentBrowserBrowsePage .tbLang[data-lang="cs"] { --tb-flag: linear-gradient(180deg, #fff 50%, #d7141a 50%); }
                #TorrentBrowserBrowsePage .tbLang[data-lang="ro"] { --tb-flag: linear-gradient(90deg, #002b7f 33.3%, #fcd116 33.3% 66.6%, #ce1126 66.6%); }
                #TorrentBrowserBrowsePage .tbLang[data-lang="nl"] { --tb-flag: linear-gradient(180deg, #ae1c28 33.3%, #fff 33.3% 66.6%, #21468b 66.6%); }
                #TorrentBrowserBrowsePage .tbLang[data-lang="pt"] { --tb-flag: linear-gradient(90deg, #046a38 40%, #da291c 40%); }
                #TorrentBrowserBrowsePage .tbLang[data-lang="sv"] { --tb-flag: linear-gradient(90deg, #006aa7 30%, #fecc00 30% 45%, #006aa7 45%); }
                #TorrentBrowserBrowsePage .tbLang[data-lang="tr"] { --tb-flag: linear-gradient(180deg, #e30a17, #e30a17); }
                #TorrentBrowserBrowsePage .tbLang[data-lang="ja"] { --tb-flag: radial-gradient(circle at 50% 50%, #bc002d 30%, #fff 30%); }
                #TorrentBrowserBrowsePage .tbLang[data-lang="ko"] { --tb-flag: radial-gradient(circle at 50% 50%, #cd2e3a 28%, #fff 28%); }
                #TorrentBrowserBrowsePage .tbLang[data-lang="zh"] { --tb-flag: linear-gradient(180deg, #de2910, #de2910); }
                #TorrentBrowserBrowsePage .tbLang[data-lang="multi"] { --tb-flag: linear-gradient(90deg, #e5533d, #e0a030, #43a047, #00a4dc); }

                #TorrentBrowserBrowsePage .tbActions {
                    display: flex;
                    gap: .4em;
                }

                #TorrentBrowserBrowsePage .tbSend {
                    flex: 1;
                    padding: .55em;
                    white-space: nowrap;
                    font-size: .82em;
                    font-family: inherit;
                    font-weight: 600;
                    color: inherit;
                    background: var(--tb-panel-hi);
                    border: 1px solid var(--tb-line);
                    border-radius: 6px;
                    cursor: pointer;
                }

                #TorrentBrowserBrowsePage .tbSend:hover:not(:disabled) {
                    color: #fff;
                    background: var(--tb-accent);
                    border-color: var(--tb-accent);
                }

                #TorrentBrowserBrowsePage .tbSend:disabled { cursor: default; }
                #TorrentBrowserBrowsePage .tbSend[data-state="sent"] { color: #fff; background: var(--tb-good); border-color: var(--tb-good); }
                #TorrentBrowserBrowsePage .tbSend[data-state="failed"] { color: #fff; background: var(--tb-bad); border-color: var(--tb-bad); }

                #TorrentBrowserBrowsePage .tbLink {
                    display: flex;
                    align-items: center;
                    padding: 0 .55em;
                    color: inherit;
                    text-decoration: none;
                    border: 1px solid var(--tb-line);
                    border-radius: 6px;
                    opacity: .7;
                }

                #TorrentBrowserBrowsePage .tbLink:hover { opacity: 1; border-color: var(--tb-accent); }
                #TorrentBrowserBrowsePage .tbLink svg { width: 1.05em; height: 1.05em; }

                #TorrentBrowserBrowsePage .tbPager {
                    display: flex;
                    gap: .75em;
                    align-items: center;
                    justify-content: center;
                    margin: 1.5em 0 .5em;
                }

                #TorrentBrowserBrowsePage .tbPager button {
                    padding: .5em 1.1em;
                    font-family: inherit;
                    color: inherit;
                    background: var(--tb-panel-hi);
                    border: 1px solid var(--tb-line);
                    border-radius: 6px;
                    cursor: pointer;
                }

                #TorrentBrowserBrowsePage .tbPager button:disabled { opacity: .4; cursor: default; }
                #TorrentBrowserBrowsePage .tbPager span { font-size: .9em; opacity: .7; }

                #TorrentBrowserBrowsePage .tbEmpty {
                    padding: 3em 1em;
                    text-align: center;
                    opacity: .6;
                }

                #TorrentBrowserBrowsePage .tbEmpty svg {
                    display: block;
                    margin: 0 auto .5em;
                }

                #TorrentBrowserBrowsePage .tbSkeleton {
                    border-radius: 10px;
                    aspect-ratio: 2 / 3;
                    background: var(--tb-panel);
                    animation: tbPulse 1.3s ease-in-out infinite;
                }

                @keyframes tbPulse { 0%, 100% { opacity: .45; } 50% { opacity: .9; } }

                /* Narrow: one card per row laid out sideways. A single-column
                   grid of 2:3 posters puts one release on a phone screen. */
                @media (max-width: 560px) {
                    #TorrentBrowserBrowsePage .tbGrow,
                    #TorrentBrowserBrowsePage .tbGo { flex: 1 1 100%; }
                    #TorrentBrowserBrowsePage .tbField { flex: 1 1 40%; }
                    #TorrentBrowserBrowsePage .tbGrid { grid-template-columns: 1fr; gap: .7em; }
                    #TorrentBrowserBrowsePage .tbCard { flex-direction: row; }
                    #TorrentBrowserBrowsePage .tbCard:hover { transform: none; }
                    #TorrentBrowserBrowsePage .tbPoster {
                        flex: 0 0 96px;
                        width: 96px;
                        align-self: flex-start;
                    }
                    #TorrentBrowserBrowsePage .tbBody { min-width: 0; }
                    #TorrentBrowserBrowsePage .tbChip { font-size: .6em; top: .3em; }
                    /* Two chips do not fit across a 96px poster, so the quality
                       one drops to the bottom corner instead of colliding. */
                    #TorrentBrowserBrowsePage .tbQuality { top: auto; bottom: .3em; left: .3em; }
                    #TorrentBrowserBrowsePage .tbPeers { right: .3em; }
                    #TorrentBrowserBrowsePage .tbActions { justify-content: flex-start; }
                    #TorrentBrowserBrowsePage .tbSend { flex: 0 1 11em; }
                }

                @media (prefers-reduced-motion: reduce) {
                    #TorrentBrowserBrowsePage .tbCard,
                    #TorrentBrowserBrowsePage .tbPoster img { transition: none; }
                    #TorrentBrowserBrowsePage .tbSkeleton { animation: none; }
                }
            </style>

            <h2 style="margin-bottom:.8em;">Browse tracker</h2>

            <div class="tbBar">
                <div class="tbField tbGrow">
                    <label for="Query">Search</label>
                    <input type="search" id="Query" class="tbInput"
                           placeholder="Title, or leave empty for the most seeded" />
                </div>

                <div class="tbField">
                    <label for="Kind">Type</label>
                    <select id="Kind" class="tbSelect">
                        <option value="">Everything</option>
                        <option value="movie">Movies</option>
                        <option value="series">Series</option>
                    </select>
                </div>

                <div class="tbField">
                    <label for="Language">Language</label>
                    <select id="Language" class="tbSelect">
                        <option value="">Any</option>
                    </select>
                </div>

                <div class="tbField">
                    <label for="Quality">Quality</label>
                    <select id="Quality" class="tbSelect">
                        <option value="">Any</option>
                    </select>
                </div>

                <div class="tbField">
                    <label for="Sort">Sort by</label>
                    <select id="Sort" class="tbSelect">
                        <option value="seeders">Seeders</option>
                        <option value="size">Size</option>
                        <option value="date">Newest</option>
                        <option value="title">Title</option>
                    </select>
                </div>

                <button type="button" id="Go" class="tbGo">Search</button>

                <button type="button" id="TvMode" class="tbGhost" aria-pressed="false"
                        title="Bigger type and stronger focus, for a TV screen">TV mode</button>
            </div>

            <p id="Status" class="tbStatus"></p>

            <div id="Results" class="tbGrid"></div>

            <div class="tbPager" id="Pager" style="display:none;">
                <button type="button" id="Prev">Previous</button>
                <span id="PageLabel"></span>
                <button type="button" id="Next">Next</button>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        (function () {
            var page = document.querySelector('#TorrentBrowserBrowsePage');
            var results = page.querySelector('#Results');
            var status = page.querySelector('#Status');
            var pager = page.querySelector('#Pager');
            var pageLabel = page.querySelector('#PageLabel');

            // The server asks the indexer for 50 per page, so a short page is
            // the last one. The grid shows 48, which is a whole number of rows
            // at every column count the layout produces.
            var PAGE_SIZE = 50;
            var VIEW_SIZE = 48;

            // How many indexer pages the opening view pulls before it claims to
            // show the most seeded releases.
            var DEPTH = 3;

            var state = {
                query: '',          // criteria the buffer belongs to
                kind: '',
                buffer: [],         // every release fetched for those criteria
                sent: {},           // release ids already accepted by the client
                serverPage: 0,      // highest indexer page fetched
                exhausted: false,   // the indexer ran out
                view: 1,            // which slice of the sorted buffer is shown
                loading: false,
                token: 0            // bumped per search, to drop stale answers
            };

            // ---- release name parsing ---------------------------------------
            //
            // Torznab gives a release name and little else, so language and
            // quality are read out of the name. Tokens are matched between
            // separators: a bare "it" inside a word is not Italian.

            var LANGUAGES = [
                { code: 'hu', label: 'HUN', tokens: ['hun', 'hungarian', 'magyar', 'szinkron'] },
                { code: 'en', label: 'ENG', tokens: ['eng', 'english'] },
                { code: 'de', label: 'GER', tokens: ['ger', 'german', 'deu'] },
                { code: 'fr', label: 'FRA', tokens: ['fre', 'french', 'fra', 'vff', 'truefrench'] },
                { code: 'it', label: 'ITA', tokens: ['ita', 'italian'] },
                { code: 'es', label: 'SPA', tokens: ['spa', 'spanish', 'esp', 'castellano'] },
                { code: 'ru', label: 'RUS', tokens: ['rus', 'russian'] },
                { code: 'pl', label: 'POL', tokens: ['pol', 'polish'] },
                { code: 'cs', label: 'CZE', tokens: ['cze', 'czech', 'ces'] },
                { code: 'ro', label: 'RON', tokens: ['rom', 'romanian', 'ron'] },
                { code: 'nl', label: 'NLD', tokens: ['dut', 'dutch', 'nld'] },
                { code: 'pt', label: 'POR', tokens: ['por', 'portuguese', 'brazilian'] },
                { code: 'sv', label: 'SWE', tokens: ['swe', 'swedish'] },
                { code: 'tr', label: 'TUR', tokens: ['tur', 'turkish'] },
                { code: 'ja', label: 'JPN', tokens: ['jpn', 'japanese', 'jap'] },
                { code: 'ko', label: 'KOR', tokens: ['kor', 'korean'] },
                { code: 'zh', label: 'CHI', tokens: ['chi', 'chinese', 'mandarin'] },
                { code: 'multi', label: 'MULTI', tokens: ['multi', 'multilang', 'multisub', 'dual', 'dualaudio'] }
            ];

            function tokensOf(title) {
                // Release names separate with dots, spaces, brackets and dashes.
                return String(title || '').toLowerCase().split(/[^a-z0-9]+/);
            }

            function detectLanguages(title) {
                var tokens = tokensOf(title);
                var found = [];

                LANGUAGES.forEach(function (lang) {
                    var hit = lang.tokens.some(function (token) {
                        return tokens.indexOf(token) !== -1;
                    });

                    if (hit) { found.push(lang); }
                });

                return found;
            }

            function detectQuality(title) {
                var name = String(title || '').toLowerCase();

                if (/\b(2160p|4k|uhd)\b/.test(name)) { return '2160p'; }
                if (/\b1080[pi]\b/.test(name)) { return '1080p'; }
                if (/\b720p\b/.test(name)) { return '720p'; }
                if (/\b(480p|576p|dvdrip|xvid)\b/.test(name)) { return 'SD'; }

                return '';
            }

            function detectSource(title) {
                var name = String(title || '').toLowerCase();

                if (/\bremux\b/.test(name)) { return 'REMUX'; }
                if (/\b(bluray|blu-ray|bdrip|brrip)\b/.test(name)) { return 'BluRay'; }
                if (/\b(web-?dl|webrip|web)\b/.test(name)) { return 'WEB'; }
                if (/\bhdtv\b/.test(name)) { return 'HDTV'; }
                if (/\b(dvdrip|dvd)\b/.test(name)) { return 'DVD'; }

                return '';
            }

            function looksLikeSeries(title) {
                return /\b(s\d{1,2}e\d{1,2}|s\d{1,2}\b|\d{1,2}x\d{2}\b|season[\s._]?\d+)/i.test(String(title || ''));
            }

            // Everything before the year, or before the first quality marker,
            // is close enough to a title for a metadata lookup.
            function guessTitle(release) {
                var name = String(release || '').replace(/[\s._\-(](19|20)\d{2}[\s._\-)]/, ' |YEAR| ');
                var cut = name.split('|YEAR|')[0];

                if (cut === name) {
                    cut = name.split(/\b(2160p|1080[pi]|720p|480p|bluray|web-?dl|webrip|hdtv|dvdrip|x264|x265|h264|h265|hevc)\b/i)[0];
                }

                return stripTrailingLanguages(cut.replace(/[._]+/g, ' ').replace(/\s+/g, ' ').trim());
            }

            // "Fargo Season 4 HUN" reads better as "Fargo Season 4": the flags
            // below the title already say which languages the release carries.
            var LANGUAGE_TOKENS = {};

            LANGUAGES.forEach(function (lang) {
                lang.tokens.forEach(function (token) { LANGUAGE_TOKENS[token] = true; });
            });

            function stripTrailingLanguages(text) {
                var words = text.split(' ').filter(Boolean);

                while (words.length > 1 && LANGUAGE_TOKENS[words[words.length - 1].toLowerCase()]) {
                    words.pop();
                }

                return words.join(' ');
            }

            // A metadata provider wants the show, not the episode: "Breaking Bad",
            // not "Breaking Bad S03E07".
            function lookupName(title) {
                return String(title || '')
                    .replace(/\s(s\d{1,2}(e\d{1,2})?|\d{1,2}x\d{2}|season\s*\d+)\b.*$/i, '')
                    .trim();
            }

            function guessYear(release) {
                var match = String(release || '').match(/\b(19|20)\d{2}\b/);
                return match ? parseInt(match[0], 10) : null;
            }

            // ---- formatting --------------------------------------------------

            function humanSize(bytes) {
                if (!bytes) { return '—'; }

                var units = ['B', 'KB', 'MB', 'GB', 'TB'];
                var i = 0;
                var value = bytes;

                while (value >= 1024 && i < units.length - 1) { value /= 1024; i++; }

                // Significant digits rather than fixed places: 13.9 GB and
                // 700 MB, not 13.96 GB and 700.00 MB.
                var decimals = value < 10 ? 2 : (value < 100 ? 1 : 0);

                return value.toFixed(decimals) + ' ' + units[i];
            }

            function humanAge(iso) {
                if (!iso) { return ''; }

                var then = new Date(iso).getTime();
                if (isNaN(then)) { return ''; }

                var days = Math.floor((Date.now() - then) / 86400000);

                if (days < 0) { return 'just now'; }
                if (days === 0) { return 'today'; }
                if (days === 1) { return 'yesterday'; }
                if (days < 30) { return days + ' days ago'; }
                if (days < 365) { return Math.round(days / 30) + ' months ago'; }

                return Math.round(days / 365) + ' years ago';
            }

            function element(tag, className, text) {
                var el = document.createElement(tag);
                if (className) { el.className = className; }
                if (text !== undefined && text !== null) { el.textContent = text; }
                return el;
            }

            // Inline SVG rather than the material-icons ligature font: if the
            // font is missing or blocked, a ligature renders as the literal
            // word "open_in_new" in the middle of the card.
            var ICONS = {
                film: 'M4 5.5h16v13H4zM8 5.5v13M16 5.5v13M4 12h4M16 12h4',
                tv: 'M3.5 5.5h17v11h-17zM8.5 20h7',
                search: 'M11 4.5a6.5 6.5 0 100 13 6.5 6.5 0 000-13zM15.8 15.8L20.5 20.5',
                funnel: 'M3.5 5.5h17l-6.5 7.5v5.5l-4-2.2v-3.3z',
                external: 'M14 4.5h5.5V10M19.5 4.5L11 13M18 14v5.5H4.5V6H10'
            };

            function icon(name, size) {
                var ns = 'http://www.w3.org/2000/svg';
                var svg = document.createElementNS(ns, 'svg');

                svg.setAttribute('viewBox', '0 0 24 24');
                svg.setAttribute('width', size || '1em');
                svg.setAttribute('height', size || '1em');
                svg.setAttribute('fill', 'none');
                svg.setAttribute('stroke', 'currentColor');
                svg.setAttribute('stroke-width', '1.5');
                svg.setAttribute('stroke-linecap', 'round');
                svg.setAttribute('stroke-linejoin', 'round');
                svg.setAttribute('aria-hidden', 'true');

                var path = document.createElementNS(ns, 'path');
                path.setAttribute('d', ICONS[name] || ICONS.film);
                svg.appendChild(path);

                return svg;
            }

            // ---- poster art --------------------------------------------------
            //
            // Jellyfin's own remote search answers with an ImageUrl from whatever
            // metadata providers the server already has configured, so no extra
            // API key is needed here. It is admin-only, it costs a provider call,
            // and it can be turned off entirely, so: lazy, queued, cached, and
            // silent when it fails.

            var posterCache = {};
            var posterQueue = [];
            var posterActive = 0;
            var postersAvailable = true;
            var POSTER_CONCURRENCY = 3;

            function cacheRead(key) {
                if (Object.prototype.hasOwnProperty.call(posterCache, key)) { return posterCache[key]; }

                try {
                    var stored = window.sessionStorage.getItem('tbPoster:' + key);
                    if (stored !== null) {
                        posterCache[key] = stored;
                        return stored;
                    }
                } catch (e) { /* private mode, or storage disabled */ }

                return undefined;
            }

            function cacheWrite(key, url) {
                posterCache[key] = url;

                try {
                    window.sessionStorage.setItem('tbPoster:' + key, url);
                } catch (e) { /* nothing we can do, the memory cache still holds */ }
            }

            function pumpPosterQueue() {
                while (posterActive < POSTER_CONCURRENCY && posterQueue.length) {
                    fetchPoster(posterQueue.shift());
                }
            }

            function fetchPoster(job) {
                if (!postersAvailable) { return; }

                posterActive++;

                var body = {
                    SearchInfo: { Name: job.name, ProviderIds: {} },
                    IncludeDisabledProviders: true
                };

                if (job.imdb) { body.SearchInfo.ProviderIds.Imdb = job.imdb; }
                if (job.year) { body.SearchInfo.Year = job.year; }

                ApiClient.ajax({
                    type: 'POST',
                    url: ApiClient.getUrl(job.series ? 'Items/RemoteSearch/Series' : 'Items/RemoteSearch/Movie'),
                    data: JSON.stringify(body),
                    contentType: 'application/json',
                    dataType: 'json'
                }).then(function (matches) {
                    var url = '';

                    for (var i = 0; i < (matches || []).length; i++) {
                        if (matches[i] && matches[i].ImageUrl) { url = matches[i].ImageUrl; break; }
                    }

                    cacheWrite(job.key, url);
                    if (url) { applyPoster(job.target, url); }
                }).catch(function (response) {
                    // 403 means this user cannot use remote search at all, so
                    // stop asking rather than firing one failure per card.
                    if (response && response.status === 403) { postersAvailable = false; }
                    cacheWrite(job.key, '');
                }).finally(function () {
                    posterActive--;
                    pumpPosterQueue();
                });
            }

            function applyPoster(holder, url) {
                if (!holder.isConnected) { return; }

                var image = new Image();

                image.onload = function () {
                    if (!holder.isConnected) { return; }
                    var art = holder.querySelector('img');
                    art.src = url;
                    art.classList.add('tbLoaded');
                    var placeholder = holder.querySelector('.tbNoArt');
                    if (placeholder) { placeholder.style.display = 'none'; }
                };

                image.src = url;
            }

            var posterObserver = window.IntersectionObserver
                ? new IntersectionObserver(function (entries, observer) {
                    entries.forEach(function (entry) {
                        if (!entry.isIntersecting) { return; }
                        observer.unobserve(entry.target);
                        requestPoster(entry.target);
                    });
                }, { rootMargin: '200px' })
                : null;

            function requestPoster(holder) {
                if (!postersAvailable) { return; }

                var job = {
                    target: holder,
                    key: holder.dataset.key,
                    name: holder.dataset.name,
                    imdb: holder.dataset.imdb,
                    year: holder.dataset.year ? parseInt(holder.dataset.year, 10) : null,
                    series: holder.dataset.series === '1'
                };

                if (!job.name && !job.imdb) { return; }

                var cached = cacheRead(job.key);

                if (cached !== undefined) {
                    if (cached) { applyPoster(holder, cached); }
                    return;
                }

                posterQueue.push(job);
                pumpPosterQueue();
            }

            // ---- rendering ---------------------------------------------------

            function buildCard(item) {
                var languages = detectLanguages(item.Title);
                var quality = detectQuality(item.Title);
                var source = detectSource(item.Title);
                var series = looksLikeSeries(item.Title);
                var name = guessTitle(item.Title);
                var year = guessYear(item.Title);

                var card = element('article', 'tbCard');

                var poster = item.DetailsUrl ? element('a', 'tbPoster') : element('div', 'tbPoster');

                if (item.DetailsUrl) {
                    poster.href = item.DetailsUrl;
                    poster.target = '_blank';
                    poster.rel = 'noopener noreferrer';
                    poster.title = 'Open on the tracker';
                }

                poster.dataset.key = item.ImdbId || (name + '|' + (year || '') + '|' + (series ? 's' : 'm'));
                poster.dataset.name = series ? lookupName(name) : name;
                poster.dataset.imdb = item.ImdbId || '';
                poster.dataset.year = year || '';
                poster.dataset.series = series ? '1' : '0';

                var art = element('img');
                art.alt = '';
                art.loading = 'lazy';
                poster.appendChild(art);

                var placeholder = element('span', 'tbNoArt');
                placeholder.appendChild(icon(series ? 'tv' : 'film'));
                poster.appendChild(placeholder);

                if (quality) { poster.appendChild(element('span', 'tbChip tbQuality', quality)); }

                var seeders = item.Seeders || 0;
                var health = seeders === 0 ? ' tbDead' : (seeders >= 5 ? ' tbHealthy' : '');
                poster.appendChild(element('span', 'tbChip tbPeers' + health,
                    '▲ ' + seeders + ' ▼ ' + Math.max(item.Leechers || 0, 0)));

                card.appendChild(poster);

                var body = element('div', 'tbBody');

                // Lead with something readable. The release name is the proof,
                // not the label — it goes underneath, quietly.
                var title = element('h3', 'tbTitle', name || item.Title);

                if (name && year) {
                    title.appendChild(document.createTextNode(' '));
                    title.appendChild(element('span', 'tbYear', year));
                }

                title.title = item.Title;
                body.appendChild(title);

                if (name) {
                    var release = element('p', 'tbRelease', item.Title);
                    release.title = item.Title;
                    body.appendChild(release);
                }

                if (languages.length || source) {
                    var tags = element('div', 'tbTags');

                    languages.forEach(function (lang) {
                        var chip = element('span', 'tbLang');
                        chip.dataset.lang = lang.code;
                        chip.appendChild(element('i', 'tbSwatch'));
                        chip.appendChild(document.createTextNode(lang.label));
                        tags.appendChild(chip);
                    });

                    if (source) {
                        var sourceChip = element('span', 'tbLang', source);
                        sourceChip.style.paddingLeft = '.45em';
                        tags.appendChild(sourceChip);
                    }

                    body.appendChild(tags);
                }

                var meta = element('div', 'tbMeta');
                meta.appendChild(element('span', '', humanSize(item.SizeBytes)));

                var age = humanAge(item.PublishDate);
                if (age) { meta.appendChild(element('span', '', age)); }

                body.appendChild(meta);

                var actions = element('div', 'tbActions');

                var send = element('button', 'tbSend', 'Send');
                send.type = 'button';

                // Cards are rebuilt on every sort, filter and page change, so
                // the sent mark has to live in state, not on the button.
                if (state.sent[item.Id]) {
                    send.dataset.state = 'sent';
                    send.textContent = 'Sent ✓';
                }

                send.addEventListener('click', function () {
                    // Never disabled: a disabled button loses focus, and on a
                    // remote that means starting again from the top of the page
                    // after every send. The state guards the second press.
                    if (send.dataset.state === 'sent' || send.dataset.state === 'sending') { return; }

                    sendRelease(item, send);
                });
                actions.appendChild(send);

                if (item.DetailsUrl) {
                    var link = element('a', 'tbLink');
                    link.href = item.DetailsUrl;
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    link.title = 'Open on the tracker';
                    link.setAttribute('aria-label', 'Open on the tracker');
                    link.appendChild(icon('external'));
                    actions.appendChild(link);
                }

                body.appendChild(actions);
                card.appendChild(body);

                if (posterObserver) { posterObserver.observe(poster); }
                else { requestPoster(poster); }

                return card;
            }

            // ---- the buffer --------------------------------------------------
            //
            // Torznab has no "sort by seeders": the indexer answers newest
            // first, so the most seeded release can be sitting on any page.
            // Everything fetched for the current criteria is therefore kept in
            // one buffer, sorted here, and paged through here. The indexer's own
            // paging is only used to widen that buffer.

            function filtered() {
                var language = page.querySelector('#Language').value;
                var quality = page.querySelector('#Quality').value;
                var sort = page.querySelector('#Sort').value;

                var items = state.buffer.filter(function (item) {
                    if (language) {
                        var codes = detectLanguages(item.Title).map(function (l) { return l.code; });
                        if (codes.indexOf(language) === -1) { return false; }
                    }

                    if (quality && detectQuality(item.Title) !== quality) { return false; }

                    return true;
                });

                return items.sort(function (a, b) {
                    if (sort === 'size') { return (b.SizeBytes || 0) - (a.SizeBytes || 0); }
                    if (sort === 'title') { return String(a.Title).localeCompare(String(b.Title)); }
                    if (sort === 'date') {
                        return new Date(b.PublishDate || 0).getTime() - new Date(a.PublishDate || 0).getTime();
                    }
                    return (b.Seeders || 0) - (a.Seeders || 0);
                });
            }

            function absorb(items) {
                var known = {};

                state.buffer.forEach(function (item) { known[item.Id] = true; });

                // An indexer that shifts between requests can repeat a release
                // across pages. Two cards for one torrent is a bug you notice.
                items.forEach(function (item) {
                    if (known[item.Id]) { return; }
                    known[item.Id] = true;
                    state.buffer.push(item);
                });
            }

            function fetchServerPage(number) {
                return ApiClient.getJSON(ApiClient.getUrl('TorrentBrowser/Search', {
                    query: state.query,
                    kind: state.kind,
                    page: number
                })).then(function (data) { return data.Items || []; });
            }

            function loadNextPage(token) {
                if (state.exhausted || state.loading) { return Promise.resolve(false); }

                state.loading = true;
                setBusy(true);

                return fetchServerPage(state.serverPage + 1).then(function (items) {
                    if (token !== state.token) { return false; }

                    state.serverPage++;
                    if (items.length < PAGE_SIZE) { state.exhausted = true; }
                    absorb(items);

                    return true;
                }).catch(function (response) {
                    if (token !== state.token) { return false; }

                    // Stop after a failure rather than asking the same broken
                    // indexer once per page turn.
                    state.exhausted = true;

                    describe(response, 'The tracker could not be reached. Check the plugin settings.',
                        function (message) { setStatus(message, true); });

                    return false;
                }).finally(function () {
                    if (token === state.token) {
                        state.loading = false;
                        setBusy(false);
                    }
                });
            }

            // Only ever disables. updatePager decides what the pager should
            // look like once the load is done; latching a disabled button here
            // would leave it dead for the rest of the session.
            function setBusy(busy) {
                page.querySelector('#Go').disabled = busy;

                if (busy) {
                    page.querySelector('#Prev').disabled = true;
                    page.querySelector('#Next').disabled = true;
                }
            }

            // Walks to a view, pulling more indexer pages until it can be filled
            // or the tracker runs out.
            function goToView(target) {
                state.view = Math.max(target, 1);

                var token = state.token;

                function fill() {
                    if (token !== state.token) { return Promise.resolve(); }
                    if (state.exhausted) { return Promise.resolve(); }
                    if (filtered().length >= state.view * VIEW_SIZE) { return Promise.resolve(); }

                    return loadNextPage(token).then(function (added) {
                        return added ? fill() : undefined;
                    });
                }

                return fill().then(function () {
                    if (token !== state.token) { return; }

                    // A filter can shrink the list under the requested view.
                    var pages = Math.max(Math.ceil(filtered().length / VIEW_SIZE), 1);
                    if (state.view > pages) { state.view = pages; }

                    refreshFilterOptions();
                    render();
                });
            }

            function refreshFilterOptions() {
                var languages = {};
                var qualities = {};

                state.buffer.forEach(function (item) {
                    detectLanguages(item.Title).forEach(function (lang) {
                        languages[lang.code] = (languages[lang.code] || 0) + 1;
                    });

                    var quality = detectQuality(item.Title);
                    if (quality) { qualities[quality] = (qualities[quality] || 0) + 1; }
                });

                fillSelect(page.querySelector('#Language'), 'Any language', Object.keys(languages)
                    .sort(function (a, b) { return languages[b] - languages[a]; })
                    .map(function (code) {
                        var known = LANGUAGES.filter(function (l) { return l.code === code; })[0];
                        return { value: code, text: (known ? known.label : code) + ' (' + languages[code] + ')' };
                    }));

                fillSelect(page.querySelector('#Quality'), 'Any quality', ['2160p', '1080p', '720p', 'SD']
                    .filter(function (q) { return qualities[q]; })
                    .map(function (q) { return { value: q, text: q + ' (' + qualities[q] + ')' }; }));
            }

            function fillSelect(select, anyLabel, options) {
                var previous = select.value;

                select.innerHTML = '';
                select.appendChild(new Option(anyLabel, ''));

                options.forEach(function (option) {
                    select.appendChild(new Option(option.text, option.value));
                });

                // Keep the chosen filter across searches when it still applies.
                select.value = previous;
                if (select.selectedIndex === -1) { select.value = ''; }
            }

            // ---- rendering ---------------------------------------------------

            function render() {
                var items = filtered();
                var start = (state.view - 1) * VIEW_SIZE;
                var slice = items.slice(start, start + VIEW_SIZE);

                results.innerHTML = '';

                if (!slice.length) {
                    var empty = element('div', 'tbEmpty');
                    empty.style.gridColumn = '1 / -1';
                    empty.appendChild(icon(state.buffer.length ? 'funnel' : 'search', '3em'));
                    empty.appendChild(element('p', '', state.buffer.length
                        ? 'Nothing on this page matches those filters.'
                        : 'Nothing matched that search. Try fewer words.'));
                    results.appendChild(empty);
                } else {
                    var fragment = document.createDocumentFragment();
                    slice.forEach(function (item) { fragment.appendChild(buildCard(item)); });
                    results.appendChild(fragment);
                }

                updateStatus(items.length, start, slice.length);
                updatePager(items.length);
            }

            function updateStatus(total, start, count) {
                if (!total) {
                    // The empty state carries the message. Leave a real error in
                    // place, but do not leave "Searching…" sitting there.
                    if (status.className.indexOf('tbError') === -1) { setStatus(''); }
                    return;
                }

                // "+" because the indexer has more pages we have not pulled.
                var more = state.exhausted ? '' : '+';
                var text = (start + 1) + '–' + (start + count) + ' of ' + total + more;

                if (total !== state.buffer.length) {
                    text += ' (filtered from ' + state.buffer.length + more + ')';
                }

                if (page.querySelector('#Sort').value === 'seeders') {
                    text += ' · most seeded first';
                }

                setStatus(text);
            }

            function updatePager(total) {
                var pages = Math.max(Math.ceil(total / VIEW_SIZE), 1);
                var more = !state.exhausted;

                pager.style.display = (pages > 1 || more) ? 'flex' : 'none';
                pageLabel.textContent = 'Page ' + state.view + ' of ' + pages + (more ? '+' : '');
                page.querySelector('#Prev').disabled = state.loading || state.view <= 1;
                page.querySelector('#Next').disabled = state.loading || (state.view >= pages && !more);
            }

            function setStatus(text, isError) {
                status.textContent = text;
                status.className = isError ? 'tbStatus tbError' : 'tbStatus';
            }

            function describe(response, fallback, then) {
                if (response && typeof response.json === 'function') {
                    response.json().then(function (body) {
                        then(body.detail || body.Message || body.title || fallback);
                    }).catch(function () { then(fallback); });
                } else {
                    then(fallback);
                }
            }

            function sendRelease(item, button) {
                button.dataset.state = 'sending';
                button.textContent = 'Sending…';

                ApiClient.ajax({
                    type: 'POST',
                    url: ApiClient.getUrl('TorrentBrowser/Releases/' + item.Id + '/Download')
                }).then(function () {
                    state.sent[item.Id] = true;
                    button.dataset.state = 'sent';
                    button.textContent = 'Sent ✓';
                }).catch(function (response) {
                    describe(response, 'The torrent client did not accept it.', function (message) {
                        button.dataset.state = 'failed';
                        button.textContent = 'Failed — retry';
                        button.title = message;
                        setStatus(message, true);
                    });
                });
            }

            function showSkeletons() {
                results.innerHTML = '';

                for (var i = 0; i < 12; i++) {
                    results.appendChild(element('div', 'tbSkeleton'));
                }
            }

            // ---- searching -----------------------------------------------------

            function newSearch() {
                state.token++;

                var token = state.token;

                state.query = page.querySelector('#Query').value.trim();
                state.kind = page.querySelector('#Kind').value;
                state.buffer = [];
                state.serverPage = 0;
                state.exhausted = false;
                state.loading = false;
                state.view = 1;

                setStatus('Searching…');
                showSkeletons();
                pager.style.display = 'none';

                return loadNextPage(token).then(function () {
                    if (token !== state.token) { return; }

                    refreshFilterOptions();
                    render();

                    // Browsing the catalogue rather than searching it: the first
                    // fifty are merely the newest fifty, so widen the pool in the
                    // background before calling anything "most seeded".
                    if (!state.query) { return deepen(token, DEPTH - 1); }
                });
            }

            function deepen(token, remaining) {
                if (!remaining || token !== state.token || state.exhausted) { return; }

                var before = visibleIds();

                return loadNextPage(token).then(function (added) {
                    if (token !== state.token) { return; }

                    // A page that did not arrive still changes the footer: the
                    // total is final now, so the "+" and Next have to go.
                    if (!added) {
                        updatePager(filtered().length);
                        return;
                    }

                    refreshFilterOptions();

                    // Re-render only when the new page actually changes what is
                    // on screen, so cards do not flicker under the pointer.
                    if (visibleIds() === before) {
                        var total = filtered().length;
                        var start = (state.view - 1) * VIEW_SIZE;
                        updateStatus(total, start, Math.min(VIEW_SIZE, total - start));
                        updatePager(total);
                    } else {
                        render();
                    }

                    return deepen(token, remaining - 1);
                });
            }

            function visibleIds() {
                return filtered()
                    .slice((state.view - 1) * VIEW_SIZE, state.view * VIEW_SIZE)
                    .map(function (item) { return item.Id; })
                    .join(',');
            }

            function turnPage(delta) {
                var fromGrid = ancestorCard(document.activeElement) !== null;
                var fromPager = pager.contains(document.activeElement);

                goToView(state.view + delta).then(function () {
                    // Page two starting half way down page one is disorienting.
                    if (results.scrollIntoView) { results.scrollIntoView({ block: 'start' }); }

                    var first = results.querySelector('.tbCard .tbSend');
                    if (!first) { return; }

                    // Every card was replaced, so a remote's focus has to be put
                    // somewhere deliberate. Paging from the pager stays on the
                    // pager, so OK can turn again — unless that button just went
                    // dead on the last page, which blurs it to the document.
                    if (fromGrid) { first.focus(); }
                    else if (fromPager && document.activeElement === document.body) { first.focus(); }
                });
            }

            // ---- remote control ------------------------------------------------
            //
            // A TV browser sends arrow keys, not tab stops, and there is no
            // pointer. Cards are navigated as a grid, and focus lands on each
            // card's Send button so OK does the obvious thing; the card itself
            // lights up through :focus-within.

            function ancestorCard(node) {
                while (node && node !== results) {
                    if (node.classList && node.classList.contains('tbCard')) { return node; }
                    node = node.parentNode;
                }

                return null;
            }

            function columnCount() {
                var template = window.getComputedStyle(results).gridTemplateColumns || '';
                var columns = template.split(' ').filter(function (part) { return part.length; }).length;

                return Math.max(columns, 1);
            }

            function focusCard(card) {
                var target = card.querySelector('.tbSend');
                if (!target) { return; }

                target.focus();

                if (card.scrollIntoView) {
                    try { card.scrollIntoView({ block: 'nearest' }); }
                    catch (e) { card.scrollIntoView(); }
                }
            }

            results.addEventListener('keydown', function (e) {
                var horizontal = e.key === 'ArrowLeft' || e.key === 'ArrowRight';
                var vertical = e.key === 'ArrowUp' || e.key === 'ArrowDown';

                if (!horizontal && !vertical) { return; }

                var cards = Array.prototype.slice.call(results.querySelectorAll('.tbCard'));
                var index = cards.indexOf(ancestorCard(document.activeElement));

                if (index === -1) { return; }

                var columns = columnCount();
                var next = index;

                if (e.key === 'ArrowRight') { next = index + 1; }
                if (e.key === 'ArrowLeft') { next = index - 1; }
                if (e.key === 'ArrowDown') { next = index + columns; }
                if (e.key === 'ArrowUp') { next = index - columns; }

                if (next >= 0 && next < cards.length) {
                    e.preventDefault();
                    focusCard(cards[next]);
                    return;
                }

                // Off the top of the grid is the search box; off the bottom is
                // the pager. Anything else stays put rather than scrolling away.
                if (e.key === 'ArrowUp' && next < 0) {
                    e.preventDefault();
                    page.querySelector('#Query').focus();
                } else if (e.key === 'ArrowDown' && pager.style.display !== 'none') {
                    var forward = page.querySelector('#Next');
                    var back = page.querySelector('#Prev');
                    var target = forward.disabled ? (back.disabled ? null : back) : forward;

                    if (target) { e.preventDefault(); target.focus(); }
                }
            });

            page.querySelector('.tbBar').addEventListener('keydown', function (e) {
                if (e.key !== 'ArrowDown') { return; }

                // A select uses up and down to change its value. Leave it alone.
                var active = document.activeElement || {};
                if ((active.tagName || '').toLowerCase() === 'select') { return; }

                var first = results.querySelector('.tbCard .tbSend');
                if (first) { e.preventDefault(); first.focus(); }
            });

            pager.addEventListener('keydown', function (e) {
                if (e.key !== 'ArrowUp') { return; }

                var cards = results.querySelectorAll('.tbCard');
                if (!cards.length) { return; }

                e.preventDefault();
                focusCard(cards[cards.length - 1]);
            });

            // ---- TV mode -------------------------------------------------------

            function applyTvMode(on) {
                if (on) { page.classList.add('tbTv'); } else { page.classList.remove('tbTv'); }

                page.querySelector('#TvMode').setAttribute('aria-pressed', on ? 'true' : 'false');

                try { window.localStorage.setItem('tbTvMode', on ? '1' : '0'); }
                catch (err) { /* private mode: the setting just will not stick */ }
            }

            page.querySelector('#TvMode').addEventListener('click', function () {
                applyTvMode(this.getAttribute('aria-pressed') !== 'true');
            });

            try {
                if (window.localStorage.getItem('tbTvMode') === '1') { applyTvMode(true); }
            } catch (err) { /* nothing stored, nothing to restore */ }

            page.querySelector('#Go').addEventListener('click', function () { newSearch(); });

            page.querySelector('#Query').addEventListener('keydown', function (e) {
                if (e.key === 'Enter') { newSearch(); }
            });

            page.querySelector('#Kind').addEventListener('change', function () { newSearch(); });

            // Filtering and sorting work on what is already buffered, so they
            // never go back to the indexer.
            ['#Language', '#Quality', '#Sort'].forEach(function (selector) {
                page.querySelector(selector).addEventListener('change', function () {
                    state.view = 1;
                    render();
                });
            });

            page.querySelector('#Prev').addEventListener('click', function () { turnPage(-1); });
            page.querySelector('#Next').addEventListener('click', function () { turnPage(1); });

            // Open on the most seeded releases rather than an empty page.
            page.addEventListener('pageshow', function () {
                if (!state.buffer.length) { newSearch(); }
            });
        })();
    </script>
</div>
</body>
</html>
